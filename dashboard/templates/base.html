<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord Server Manager Ultimate</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/">DSMU</a><div><a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Dashboard</a>{% if current_user.is_authenticated %}<a class="btn btn-outline-warning btn-sm" href="{{ url_for('logout') }}">Logout</a>{% endif %}</div></div></nav><main class="container py-4">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-success">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
