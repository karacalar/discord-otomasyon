{% extends "base.html" %}{% block content %}<h1>{{page}}</h1><div class="row g-3">{% for k,v in counts.items() %}<div class="col-md-3"><div class="card shadow"><div class="card-body"><h5>{{k|title}}</h5><p class="display-6">{{v}}</p></div></div></div>{% endfor %}</div><div class="list-group mt-4">{% for p in ['settings','tickets','logs','auto-moderation','reaction-roles','embeds','giveaways','backups','statistics'] %}<a class="list-group-item list-group-item-action" href="{{ url_for('dashboard_page', page=p) }}">{{p|title}}</a>{% endfor %}</div>{% endblock %}
